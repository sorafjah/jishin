<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>じしんひなんくんれん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDMincho&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-sky: #eef3f6;
    --ink: #2b2f36;
    --ink-soft: #5b6270;
    --paper: #ffffff;
    --line: #d8dee4;
    --accent: #3a6ea5;
    --accent-soft: #dbe8f4;
    --warn: #b5482a;
    --warn-soft: #f6e2da;
    --ok: #2f7a52;
    --ok-soft: #dcefe2;
    --wood: #c9a06a;
    --wood-dark: #a9814f;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
    font-family: 'BIZ UDPGothic', sans-serif;
    background: var(--bg-sky);
    color: var(--ink);
  }
  #stage{
    position: fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .screen{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    align-items:center; justify-content:center;
    padding: clamp(16px, 4vw, 48px);
  }
  .screen.active{ display:flex; }

  button{
    font-family: inherit;
    cursor:pointer;
    border:none;
    touch-action: manipulation;
  }
  button:focus-visible{ outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- 待機画面 ---------- */
  #screen-idle{
    background: linear-gradient(180deg, #f5f8fa 0%, #eef3f6 100%);
  }
  .idle-card{
    text-align:center;
    max-width: 560px;
  }
  .idle-mark{
    width: clamp(64px, 10vw, 96px);
    height: clamp(64px, 10vw, 96px);
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--accent-soft);
    display:flex; align-items:center; justify-content:center;
    font-size: clamp(30px, 5vw, 42px);
  }
  .idle-title{
    font-size: clamp(20px, 3vw, 30px);
    font-weight:700;
    color: var(--ink);
    margin: 0 0 32px;
    line-height:1.5;
  }
  .idle-sub{
    font-size: clamp(14px, 1.8vw, 18px);
    color: var(--ink-soft);
    margin: 0 0 32px;
    line-height:1.8;
  }
  .start-btn{
    min-width: 220px;
    min-height: 64px;
    padding: 16px 40px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: clamp(17px, 2.2vw, 22px);
    font-weight:700;
    box-shadow: 0 6px 0 #2a5580;
    transition: transform .08s ease;
  }
  .start-btn:active{ transform: translateY(4px); box-shadow: 0 2px 0 #2a5580; }

  /* ---------- 地震発生画面（Three.js 3D教室） ---------- */
  #screen-quake{
    background: #0b0d10;
    flex-direction: column;
    padding: clamp(10px, 2vh, 20px) 0 clamp(8px, 1.4vh, 14px);
  }
  #shake-root{
    width:100%;
    flex: 1;
    min-height: 0;
    position:relative;
    overflow:hidden;
    border-radius: 12px;
  }
  #quake3d-canvas{
    display:block;
    width:100%; height:100%;
    touch-action: none;
  }

  .quake-banner-row{
    position: relative;
    display:flex; align-items:center; justify-content:center;
    gap: clamp(10px, 1.6vw, 18px);
    padding: 0 clamp(10px, 2vw, 20px);
    margin-top: -9.5vh;
    z-index: 6;
  }
  .quake-banner{
    flex: 1 1 auto;
    max-width: min(820px, 82vw);
    padding: clamp(8px, 1.4vw, 14px) clamp(16px, 3vw, 32px);
    border-radius: 10px;
    background: var(--warn);
    color:#fff;
    font-weight:700;
    font-size: clamp(13px, 1.9vw, 19px);
    text-align:center;
    line-height:1.5;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .35s ease, transform .35s ease;
  }
  .quake-banner.show{ opacity: 1; transform: translateY(0); }

  .next-phase-btn{
    flex: 0 0 auto;
    min-height: 40px; min-width: 100px;
    padding: 8px 18px;
    border-radius: 999px;
    background: var(--paper);
    color: var(--ink-soft);
    border: 2px solid var(--line);
    font-size: clamp(12px, 1.5vw, 15px);
    font-weight:700;
    opacity: 0;
    pointer-events:none;
    transition: opacity .3s ease, background .12s ease;
  }
  .next-phase-btn.show{ opacity: 1; pointer-events:auto; }
  .next-phase-btn:active{ background: var(--accent-soft); }

  @media (max-width: 560px){
    .quake-banner-row{
      flex-direction: column;
      margin-top: -10.5vh;
    }
    .quake-banner{ max-width: 92vw; }
  }

  /* ---------- クイズ画面 ---------- */
  #screen-quiz{
    background: #f7f5f0;
  }
  .quiz-wrap{
    width: min(760px, 92vw);
    text-align:center;
  }
  .quiz-image-wrap{
    margin: 0 auto 20px;
    max-width: min(504px, 84vw);
    max-height: 39.2vh;
    display:flex;
    justify-content:center;
  }
  .quiz-image-wrap img{
    max-width: 100%;
    max-height: 39.2vh;
    border-radius: 12px;
    object-fit: contain;
  }
  .quiz-q-text{
    font-size: clamp(22px, 3.4vw, 32px);
    font-weight:700;
    line-height:1.6;
    margin: 0 0 36px;
    padding: 0 8px;
  }
  .quiz-choices{
    display:flex; gap: clamp(16px, 3vw, 32px);
    justify-content:center;
    margin-bottom: 14px;
  }
  .choice-btn{
    width: clamp(120px, 22vw, 200px);
    height: clamp(72px, 13.2vw, 120px);
    border-radius: 24px;
    font-size: clamp(36px, 6vw, 52px);
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .choice-maru{
    background: var(--ok-soft);
    color: var(--ok);
    box-shadow: 0 6px 0 #1f5c3d;
  }
  .choice-batsu{
    background: var(--warn-soft);
    color: var(--warn);
    box-shadow: 0 6px 0 #8a3620;
  }
  .choice-btn:active{ transform: translateY(4px); }
  .choice-maru:active{ box-shadow: 0 2px 0 #1f5c3d; }
  .choice-batsu:active{ box-shadow: 0 2px 0 #8a3620; }
  .choice-btn:disabled{ pointer-events:none; opacity:.4; }
  .choice-btn:disabled.selected{ opacity:1; }

  .quiz-feedback{
    min-height: 0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 6px;
  }
  .feedback-label{
    font-size: clamp(20px, 3vw, 28px);
    font-weight:700;
  }
  .feedback-label.correct{ color: var(--ok); }
  .feedback-label.wrong{ color: var(--warn); }
  .feedback-text{
    font-size: clamp(14px, 1.8vw, 18px);
    color: var(--ink-soft);
  }
  .next-q-btn{
    margin-top: 10px;
    min-height: 56px; min-width: 180px;
    padding: 12px 30px;
    border-radius: 999px;
    background: var(--accent);
    color:#fff;
    font-size: clamp(15px, 2vw, 19px);
    font-weight:700;
    box-shadow: 0 5px 0 #2a5580;
  }
  .next-q-btn:active{ transform: translateY(3px); box-shadow: 0 2px 0 #2a5580; }

  /* ---------- 振り返り画面 ---------- */
  #screen-result{
    background: linear-gradient(180deg, #f5f8fa 0%, #eef3f6 100%);
  }
  .result-wrap{
    width: min(700px, 92vw);
    text-align:center;
  }
  .result-score{
    font-size: clamp(16px, 2.2vw, 20px);
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .result-score b{
    font-size: clamp(30px, 5vw, 44px);
    color: var(--accent);
    margin: 0 6px;
  }
  .result-title{
    font-size: clamp(20px, 2.8vw, 26px);
    font-weight:700;
    margin: 10px 0 24px;
  }
  .result-list{
    list-style:none; margin:0 0 32px; padding:0;
    display:flex; flex-direction:column; gap: 10px;
    text-align:left;
  }
  .result-item{
    display:flex; align-items:center; gap: 14px;
    padding: 12px 18px;
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 12px;
    font-size: clamp(14px, 1.8vw, 17px);
  }
  .result-item .mark{
    flex: 0 0 auto;
    width: 34px; height: 34px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size: 18px;
    color:#fff;
  }
  .result-item.ok .mark{ background: var(--ok); }
  .result-item.ng .mark{ background: var(--warn); }
  .result-item .body{ flex:1; line-height:1.6; }
  .result-item .answered{ font-size: 13px; color: var(--ink-soft); margin-top:2px; }

  .result-message{
    font-size: clamp(14px, 1.9vw, 18px);
    color: var(--ink-soft);
    line-height:1.9;
    margin-bottom: 30px;
  }
  .result-btns{
    display:flex; gap: 16px; justify-content:center; flex-wrap:wrap;
  }
  .btn-secondary{
    min-height: 56px; min-width: 160px;
    padding: 12px 28px;
    border-radius: 999px;
    background: var(--paper);
    color: var(--accent);
    border: 2px solid var(--accent);
    font-size: clamp(15px, 2vw, 18px);
    font-weight:700;
  }
  .btn-secondary:active{ background: var(--accent-soft); }

  /* ---------- 先生用パネル ---------- */
  #teacher-fab{
    position: fixed; left: 14px; top: calc(env(safe-area-inset-top,0) + 14px);
    width: 44px; height: 44px;
    background: transparent;
    border: none;
    font-size: 24px;
    display:flex; align-items:center; justify-content:center;
    z-index: 100;
    opacity: .55;
  }
  #teacher-fab:active{ opacity: .9; }
  #teacher-panel{
    position: fixed; inset:0;
    background: rgba(20,24,30,.5);
    display:none;
    align-items:center; justify-content:center;
    z-index: 200;
    padding: 16px;
  }
  #teacher-panel.open{ display:flex; }
  .panel-card{
    width: min(560px, 96vw);
    max-height: 90vh;
    overflow-y: auto;
    background: var(--paper);
    border-radius: 16px;
    padding: 24px clamp(16px,3vw,28px);
  }
  .panel-title{
    font-size: 19px; font-weight:700; margin: 0 0 4px;
  }
  .panel-sub{
    font-size: 13px; color: var(--ink-soft); margin: 0 0 20px;
  }
  .panel-section{ margin-bottom: 22px; }
  .panel-label{
    font-size: 14px; font-weight:700; color: var(--ink); margin-bottom: 8px;
    display:block;
  }
  .stepper{
    display:flex; align-items:center; gap: 10px;
  }
  .stepper button{
    width: 44px; height:44px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 20px; font-weight:700;
  }
  .stepper input{
    width: 70px; height: 44px;
    text-align:center; font-size:16px;
    border: 2px solid var(--line); border-radius: 10px;
    font-family: inherit;
  }
  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .toggle-row:last-child{ border-bottom:none; }
  .switch{
    position:relative; width: 52px; height: 30px;
    border-radius: 999px; background: var(--line);
    flex: 0 0 auto;
  }
  .switch.on{ background: var(--accent); }
  .switch::after{
    content:""; position:absolute; top:3px; left:3px;
    width:24px; height:24px; border-radius:50%;
    background:#fff;
    transition: transform .15s ease;
  }
  .switch.on::after{ transform: translateX(22px); }
  .q-edit{
    display:flex; flex-direction:column; gap:8px;
    padding: 12px; margin-bottom: 10px;
    background: #f7f8fa; border-radius: 10px;
  }
  .q-edit-row{ display:flex; align-items:center; gap:8px; }
  .q-edit-row label{ font-size:12px; color: var(--ink-soft); width: 48px; flex:0 0 auto; }
  .q-edit-row input[type=text]{
    flex:1; height: 40px; padding: 0 10px;
    border:2px solid var(--line); border-radius:8px;
    font-family: inherit; font-size: 14px;
  }
  .q-edit-row select{
    height:40px; border:2px solid var(--line); border-radius:8px;
    font-family: inherit; font-size:14px; padding: 0 8px;
  }
  .q-edit-img-row{
    display:flex; align-items:center; gap:10px;
  }
  .q-edit-img-preview{
    width: 40px; height:40px; border-radius:6px;
    object-fit:cover; border:1px solid var(--line);
    display:none;
  }
  .q-edit-img-preview.show{ display:block; }
  .q-edit-img-btn{
    height:40px; padding: 0 14px;
    border-radius:8px; border:2px solid var(--line);
    background: var(--paper); font-size:13px; color: var(--ink-soft);
  }
  .q-edit-img-remove{
    height:40px; padding: 0 10px;
    border-radius:8px; border:none;
    background: transparent; font-size:13px; color: var(--warn);
    display:none;
  }
  .q-edit-img-remove.show{ display:inline-block; }
  .q-edit-img-url{
    display:flex; align-items:center; gap:8px;
  }
  .q-edit-img-url label{ font-size:12px; color: var(--ink-soft); width: 48px; flex:0 0 auto; }
  .q-edit-img-url input[type=text]{
    flex:1; height: 38px; padding: 0 10px;
    border:2px solid var(--line); border-radius:8px;
    font-family: inherit; font-size: 13px;
  }
  .q-edit-img-url button{
    height:38px; padding: 0 12px;
    border-radius:8px; border:2px solid var(--line);
    background: var(--paper); font-size:13px; color: var(--ink-soft);
    flex: 0 0 auto;
  }
  .q-edit-delete-row{
    display:flex; justify-content:flex-end;
    padding-top: 4px;
    border-top: 1px dashed var(--line);
    margin-top: 4px;
  }
  .q-edit-delete-btn{
    height: 36px; padding: 0 14px;
    border-radius: 8px; border:none;
    background: var(--warn-soft); color: var(--warn);
    font-size: 13px; font-weight:700;
  }
  .q-add-btn{
    display:block; width:100%;
    min-height: 48px;
    margin-top: 6px;
    border-radius: 10px;
    border: 2px dashed var(--line);
    background: transparent;
    color: var(--accent);
    font-size: 15px; font-weight:700;
  }
  .panel-save-section{
    padding-top: 14px;
    border-top: 1px solid var(--line);
    text-align:center;
  }
  .panel-save-btn{
    display:block; width:100%;
    min-height: 52px;
    border-radius: 12px;
    background: var(--ok);
    color:#fff;
    font-size: 16px; font-weight:700;
  }
  .panel-save-note{
    font-size: 12px; color: var(--ink-soft);
    margin: 8px 0 0;
  }
  .panel-close{
    display:block; margin: 6px auto 0;
    min-height: 48px; min-width: 140px;
    padding: 10px 26px;
    border-radius: 999px;
    background: var(--accent); color:#fff;
    font-size: 16px; font-weight:700;
  }

  @media (max-height: 480px){
    .idle-mark{ display:none; }
    .idle-sub{ margin-bottom: 18px; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
</head>
<body>

<div id="stage">

  <!-- 待機画面 -->
  <section id="screen-idle" class="screen active">
    <div class="idle-card">
      <div class="idle-mark">🏫</div>
      <p class="idle-title"><ruby>地震<rt>じしん</rt></ruby>がきたときの<ruby>練習<rt>れんしゅう</rt></ruby>をするよ</p>
      <button class="start-btn" id="btn-start">はじめる</button>
    </div>
  </section>

  <!-- 地震発生画面 -->
  <section id="screen-quake" class="screen">
    <div id="shake-root">
      <canvas id="quake3d-canvas"></canvas>
    </div>
    <div class="quake-banner-row" id="quake-banner-row">
      <div class="quake-banner" id="quake-banner">
        <span id="banner-text">きんきゅう<ruby>地震<rt>じしん</rt></ruby><ruby>速報<rt>そくほう</rt></ruby></span>
      </div>
      <button class="next-phase-btn" id="btn-to-hide">つぎへ</button>
    </div>
  </section>

  <!-- クイズ画面 -->
  <section id="screen-quiz" class="screen">
    <div class="quiz-wrap">
      <div class="quiz-image-wrap" id="quiz-image-wrap" style="display:none;">
        <img id="quiz-image" alt="">
      </div>
      <p class="quiz-q-text" id="quiz-q-text">机の下にかくれる</p>
      <div class="quiz-choices">
        <button class="choice-btn choice-maru" id="btn-maru">○</button>
        <button class="choice-btn choice-batsu" id="btn-batsu">×</button>
      </div>
      <div class="quiz-feedback" id="quiz-feedback"></div>
    </div>
  </section>

  <!-- 振り返り画面 -->
  <section id="screen-result" class="screen">
    <div class="result-wrap">
      <p class="result-score"><b id="result-score-num">0</b>／<span id="result-score-total">5</span> もん せいかい</p>
      <p class="result-title" id="result-title">よくできました</p>
      <ul class="result-list" id="result-list"></ul>
      <p class="result-message">じしんが来たら、まず<ruby>机<rt>つくえ</rt></ruby>の下にかくれて、<ruby>頭<rt>あたま</rt></ruby>を<ruby>守<rt>まも</rt></ruby>ろうね。</p>
      <div class="result-btns">
        <button class="start-btn" id="btn-restart">もういちど</button>
        <button class="btn-secondary" id="btn-to-idle">はじめの<ruby>画面<rt>がめん</rt></ruby>へ</button>
      </div>
    </div>
  </section>

</div>

<!-- 先生用パネル -->
<button id="teacher-fab" aria-label="先生用設定">⚙️</button>
<div id="teacher-panel">
  <div class="panel-card">
    <p class="panel-title">先生用の設定</p>

    <div class="panel-section">
      <span class="panel-label">ゆれが始まるまでの<ruby>時間<rt>じかん</rt></ruby>（秒）</span>
      <div class="stepper">
        <button data-step="wait" data-delta="-1">−</button>
        <input type="text" id="input-wait" value="3" inputmode="numeric">
        <button data-step="wait" data-delta="1">＋</button>
      </div>
    </div>

    <div class="panel-section">
      <span class="panel-label">ゆれの長さ（秒）</span>
      <div class="stepper">
        <button data-step="duration" data-delta="-1">−</button>
        <input type="text" id="input-duration" value="6" inputmode="numeric">
        <button data-step="duration" data-delta="1">＋</button>
      </div>
    </div>

    <div class="panel-section">
      <span class="panel-label">ゆれの強さ</span>
      <div class="stepper">
        <button data-step="intensity" data-delta="-1">−</button>
        <input type="text" id="input-intensity" value="3" inputmode="numeric">
        <button data-step="intensity" data-delta="1">＋</button>
      </div>
    </div>

    <div class="panel-section">
      <div class="toggle-row">
        <span class="panel-label" style="margin:0;">効果音</span>
        <div class="switch on" id="switch-sound"></div>
      </div>
    </div>

    <div class="panel-section">
      <span class="panel-label">○×もんだい（あとで文言を変えられます）</span>
      <div id="q-edit-list"></div>
      <button class="q-add-btn" id="btn-add-question">＋ もんだいを追加</button>
    </div>

    <div class="panel-section panel-save-section">
      <button class="panel-save-btn" id="btn-save-html">この設定でHTMLをほぞんする</button>
      <p class="panel-save-note">今の設定を入れた新しいファイルがダウンロードされます</p>
    </div>

    <button class="panel-close" id="btn-panel-close">とじる</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- 状態管理 ---------------- */
  /* SAVED_STATE_START */
  const state = {
    waitSec: 3,
    durationSec: 6,
    intensity: 3, // 1〜5
    soundOn: true,
    questions: [
      { text: "机の上に乗る", answer: false, image: null },
      { text: "机の下にかくれる", answer: true, image: null },
      { text: "頭を手や物で守る", answer: true, image: null },
      { text: "すぐに外へ走って逃げる", answer: false, image: null },
      { text: "棚が倒れないようにおさえる", answer: false, image: null }
    ],
    quizIndex: 0,
    results: [] // { text, answer(bool), chosen(bool), correct(bool) }
  };
  /* SAVED_STATE_END */

  /* ---------------- 画面切り替え ---------------- */
  const screens = {
    idle: document.getElementById('screen-idle'),
    quake: document.getElementById('screen-quake'),
    quiz: document.getElementById('screen-quiz'),
    result: document.getElementById('screen-result')
  };
  function showScreen(name){
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
  }

  /* ---------------- 音（Web Audio APIで合成） ---------------- */
  let audioCtx = null;
  function getCtx(){
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }
  function beep(freq, startTime, dur, gainPeak){
    if (!state.soundOn) return;
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(gainPeak, startTime + 0.03);
    gain.gain.linearRampToValueAtTime(0, startTime + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + dur + 0.05);
  }
  function playAlertChime(){
    if (!state.soundOn) return;
    const ctx = getCtx();
    const now = ctx.currentTime;
    // 緊急地震速報を模した、2音の繰り返しチャイムを3回×2セット（セットの間に間を空ける）
    const chimeSet = (startTime) => {
      for (let i = 0; i < 3; i++){
        const t = startTime + i * 0.55;
        beep(880, t, 0.18, 0.14);
        beep(660, t + 0.22, 0.18, 0.14);
      }
    };
    const oneSetDuration = 2*0.55 + 0.22 + 0.18; // 3回セットの所要時間
    const gapBetweenSets = 0.5;
    chimeSet(now);
    chimeSet(now + oneSetDuration + gapBetweenSets);
  }
  function playCorrectSound(){
    // 「ピンポーン」正解チャイム：澄んだ2音（ピン→ポーン、後の音を長めに伸ばす）
    if (!state.soundOn) return;
    const ctx = getCtx();
    const now = ctx.currentTime;
    const mkChime = (freq, startTime, dur, peak) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, startTime);
      gain.gain.linearRampToValueAtTime(peak, startTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + dur + 0.05);
    };
    mkChime(988, now, 0.28, 0.16);        // ピン
    mkChime(1319, now + 0.16, 0.55, 0.16); // ポーン（長め）
  }
  function playWrongSound(){
    // 「ふにゃふにゃ〜」不正解音：音程がゆらぎながら下降する、責めない柔らかい音
    if (!state.soundOn) return;
    const ctx = getCtx();
    const now = ctx.currentTime;
    const dur = 0.55;
    const steps = 40;
    const curve = new Float32Array(steps);
    for (let i = 0; i < steps; i++){
      const progress = i/(steps-1);
      const base = 380 + (170-380)*progress;
      const wobble = Math.sin(progress*Math.PI*6) * 26 * (1-progress);
      curve[i] = base + wobble;
    }
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueCurveAtTime(curve, now, dur);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.13, now + 0.05);
    gain.gain.linearRampToValueAtTime(0, now + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + dur + 0.05);
  }
  function playRumbleSound(durationSec, levelMult, startDelay){
    // 本震の地鳴り音：機械的な音を避けつつ、タブレット内蔵スピーカーでも聞こえる帯域に調整
    // levelMult: 音量の倍率（1回目=1.0、弱める2回目=0.6程度を想定）
    // startDelay: 呼び出し時点から何秒後に鳴らし始めるか（連続再生の2回目用）
    if (!state.soundOn) return;
    const ctx = getCtx();
    const now = ctx.currentTime + (startDelay || 0);
    const dur = Math.max(0.6, Math.min(durationSec || 3, 6));
    const lvl = levelMult !== undefined ? levelMult : 1;

    // ノイズバッファ（ゴーッという質感のベース。低すぎるとタブレットのスピーカーで聞こえないため帯域を調整）
    const bufferSize = Math.floor(ctx.sampleRate * dur);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    let lastOut = 0;
    for (let i = 0; i < bufferSize; i++){
      const white = Math.random()*2 - 1;
      lastOut = (lastOut + 0.06*white) / 1.06; // ローパス（強すぎるとタブレットで聞こえなくなるため緩める）
      data[i] = lastOut * 3.2;
    }
    const noiseSrc = ctx.createBufferSource();
    noiseSrc.buffer = buffer;

    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'lowpass';
    noiseFilter.frequency.value = 260; // タブレット内蔵スピーカーでも聞こえる帯域に
    noiseFilter.Q.value = 0.6;

    // ゆっくりした音量のうねり（地面が揺れているような不規則感。LFOで自然にゆらす）
    const noiseGain = ctx.createGain();
    const noisePeak = 0.32 * lvl;
    noiseGain.gain.setValueAtTime(0, now);
    noiseGain.gain.linearRampToValueAtTime(noisePeak, now + 0.3);
    noiseGain.gain.setValueAtTime(noisePeak, now + Math.max(0.4, dur-0.7));
    noiseGain.gain.linearRampToValueAtTime(0, now + dur);

    const swellLFO = ctx.createOscillator();
    swellLFO.type = 'sine';
    swellLFO.frequency.value = 0.9;
    const swellLFOGain = ctx.createGain();
    swellLFOGain.gain.value = 0.08 * lvl;
    swellLFO.connect(swellLFOGain);
    swellLFOGain.connect(noiseGain.gain);

    noiseSrc.connect(noiseFilter).connect(noiseGain).connect(ctx.destination);
    noiseSrc.start(now); swellLFO.start(now);
    noiseSrc.stop(now + dur + 0.05); swellLFO.stop(now + dur + 0.05);

    // 低めの唸り（サイン波2本のうなり）。タブレットで聞こえるよう周波数を少し上げる
    const rumbleGain = ctx.createGain();
    const rumblePeak = 0.14 * lvl;
    rumbleGain.gain.setValueAtTime(0, now);
    rumbleGain.gain.linearRampToValueAtTime(rumblePeak, now + 0.3);
    rumbleGain.gain.setValueAtTime(rumblePeak, now + Math.max(0.4, dur-0.7));
    rumbleGain.gain.linearRampToValueAtTime(0, now + dur);
    rumbleGain.connect(ctx.destination);

    [78, 82].forEach(freq => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.connect(rumbleGain);
      osc.start(now);
      osc.stop(now + dur + 0.05);
    });
  }

  /* ---------------- 揺れアニメーション（3D教室はQuake3D側でrAF駆動） ---------------- */
  const shakeRoot = document.getElementById('shake-root');
  const banner = document.getElementById('quake-banner');
  const bannerText = document.getElementById('banner-text');
  const btnToHide = document.getElementById('btn-to-hide');

  let quakeAnim = { running:false, elapsed:0 };

  function intensityToLevel(level){
    // level 1〜5 → そのままQuake3Dの強さレベルとして使う
    return level;
  }

  function startQuakeSequence(){
    showScreen('quake');
    banner.classList.remove('show');
    btnToHide.classList.remove('show');
    bannerText.innerHTML = 'きんきゅう<ruby>地震<rt>じしん</rt></ruby><ruby>速報<rt>そくほう</rt></ruby>';
    if (window.Quake3D) window.Quake3D.reset();

    // 速報チャイム：3回×2セット（セット間に間を空ける）の所要時間
    const chimeOneSetSec = 2*0.55 + 0.22 + 0.18; // 1.5秒
    const chimeGapSec = 0.5;
    const chimeTotalSec = chimeOneSetSec*2 + chimeGapSec; // 3.5秒
    const gapAfterChimeSec = 0.8; // 速報後、本震までの間

    // フェーズ0: 教室をそのまま設定秒数だけ見せる（まだ何も起きない）
    setTimeout(() => {
      // フェーズ1: 速報（3回→間→3回）
      banner.classList.add('show');
      playAlertChime();

      setTimeout(() => {
        // フェーズ2: 本震開始。地鳴りを「強め→少し弱め」の2回に分けて鳴らす
        bannerText.innerHTML = '<ruby>地震<rt>じしん</rt></ruby> はっせい　ゆれています。<ruby>机<rt>つくえ</rt></ruby>の<ruby>下<rt>した</rt></ruby>にかくれて<ruby>頭<rt>あたま</rt></ruby>を<ruby>守<rt>まも</rt></ruby>ろう';
        const rumbleGapSec = 0.5;
        const gapAfterRumbleSec = 0.8; // 地鳴りが鳴り終わってから「おさまりました」表示までの間
        const rumbleEachSec = Math.max(1, (state.durationSec - gapAfterRumbleSec - rumbleGapSec) / 2);
        playRumbleSound(rumbleEachSec, 1.0, 0);
        playRumbleSound(rumbleEachSec, 0.6, rumbleEachSec + rumbleGapSec);
        if (window.Quake3D) {
          window.Quake3D.startShake(state.durationSec, intensityToLevel(state.intensity), onQuakeSettled);
        } else {
          onQuakeSettled();
        }
      }, (chimeTotalSec + gapAfterChimeSec) * 1000);
    }, state.waitSec * 1000);
  }

  function onQuakeSettled(){
    bannerText.innerHTML = 'ゆれは おさまりました';
    btnToHide.classList.add('show');
    if (window.Quake3D) window.Quake3D.crouch(true);
  }

  /* ---------------- クイズ ---------------- */
  const quizQText = document.getElementById('quiz-q-text');
  const quizImageWrap = document.getElementById('quiz-image-wrap');
  const quizImage = document.getElementById('quiz-image');
  const btnMaru = document.getElementById('btn-maru');
  const btnBatsu = document.getElementById('btn-batsu');
  const quizFeedback = document.getElementById('quiz-feedback');

  function startQuiz(){
    state.quizIndex = 0;
    state.results = [];
    if (window.Quake3D) window.Quake3D.crouch(false);
    showScreen('quiz');
    showQuestion();
  }

  function showQuestion(){
    const q = state.questions[state.quizIndex];
    quizQText.textContent = q.text;
    quizFeedback.innerHTML = '';
    btnMaru.disabled = false;
    btnBatsu.disabled = false;
    btnMaru.classList.remove('selected');
    btnBatsu.classList.remove('selected');

    if (q.image) {
      quizImage.src = q.image;
      quizImageWrap.style.display = 'flex';
    } else {
      quizImage.removeAttribute('src');
      quizImageWrap.style.display = 'none';
    }
  }

  function answerQuiz(chosenTrue){
    const q = state.questions[state.quizIndex];
    const correct = (chosenTrue === q.answer);
    btnMaru.disabled = true;
    btnBatsu.disabled = true;
    (chosenTrue ? btnMaru : btnBatsu).classList.add('selected');
    state.results.push({ text: q.text, answer: q.answer, chosen: chosenTrue, correct: correct });

    if (correct) playCorrectSound(); else playWrongSound();

    const label = document.createElement('p');
    label.className = 'feedback-label ' + (correct ? 'correct' : 'wrong');
    label.textContent = correct ? 'せいかい！' : 'おしい！';

    const nextBtn = document.createElement('button');
    nextBtn.className = 'next-q-btn';
    const isLast = state.quizIndex === state.questions.length - 1;
    nextBtn.textContent = isLast ? 'けっかを見る' : 'つぎのもんだいへ';
    nextBtn.addEventListener('click', () => {
      if (isLast) {
        showResult();
      } else {
        state.quizIndex += 1;
        showQuestion();
      }
    });

    quizFeedback.innerHTML = '';
    quizFeedback.appendChild(label);
    quizFeedback.appendChild(nextBtn);
  }

  btnMaru.addEventListener('click', () => answerQuiz(true));
  btnBatsu.addEventListener('click', () => answerQuiz(false));

  /* ---------------- 振り返り画面 ---------------- */
  function showResult(){
    const correctCount = state.results.filter(r => r.correct).length;
    const total = state.results.length;
    document.getElementById('result-score-num').textContent = correctCount;
    document.getElementById('result-score-total').textContent = total;

    const titleEl = document.getElementById('result-title');
    if (correctCount === total) titleEl.textContent = 'ぜんもん せいかい！すごいね';
    else if (correctCount >= Math.ceil(total * 0.6)) titleEl.textContent = 'よく できました';
    else titleEl.textContent = 'もういちど かくにんしよう';

    const list = document.getElementById('result-list');
    list.innerHTML = '';
    state.results.forEach(r => {
      const li = document.createElement('li');
      li.className = 'result-item ' + (r.correct ? 'ok' : 'ng');
      const mark = document.createElement('div');
      mark.className = 'mark';
      mark.textContent = r.correct ? '○' : '×';
      const body = document.createElement('div');
      body.className = 'body';
      const p1 = document.createElement('div');
      p1.textContent = r.text;
      const p2 = document.createElement('div');
      p2.className = 'answered';
      p2.textContent = 'あなたのこたえ：' + (r.chosen ? '○' : '×') + '　／　正しいこたえ：' + (r.answer ? '○' : '×');
      body.appendChild(p1);
      body.appendChild(p2);
      li.appendChild(mark);
      li.appendChild(body);
      list.appendChild(li);
    });

    showScreen('result');
  }

  /* ---------------- 画面遷移トリガー ---------------- */
  document.getElementById('btn-start').addEventListener('click', () => {
    getCtx(); // iOS向け: ユーザー操作直後にAudioContextを起動
    startQuakeSequence();
  });
  document.getElementById('btn-to-hide').addEventListener('click', startQuiz);
  document.getElementById('btn-restart').addEventListener('click', () => {
    getCtx();
    startQuakeSequence();
  });
  document.getElementById('btn-to-idle').addEventListener('click', () => {
    showScreen('idle');
  });

  /* ---------------- 先生用パネル ---------------- */
  const teacherFab = document.getElementById('teacher-fab');
  const teacherPanel = document.getElementById('teacher-panel');
  const inputWait = document.getElementById('input-wait');
  const inputDuration = document.getElementById('input-duration');
  const inputIntensity = document.getElementById('input-intensity');
  const switchSound = document.getElementById('switch-sound');
  const qEditList = document.getElementById('q-edit-list');
  const btnAddQuestion = document.getElementById('btn-add-question');

  teacherFab.addEventListener('click', () => {
    teacherPanel.classList.add('open');
    renderQuestionEditors();
  });
  document.getElementById('btn-panel-close').addEventListener('click', () => {
    teacherPanel.classList.remove('open');
  });
  teacherPanel.addEventListener('click', (e) => {
    if (e.target === teacherPanel) teacherPanel.classList.remove('open');
  });

  /* ---------------- HTML保存（この設定を埋め込んだファイルをDL） ---------------- */
  document.getElementById('btn-save-html').addEventListener('click', () => {
    try {
      const savedState = {
        waitSec: state.waitSec,
        durationSec: state.durationSec,
        intensity: state.intensity,
        soundOn: state.soundOn,
        questions: state.questions.map(q => ({ text: q.text, answer: q.answer, image: q.image })),
        quizIndex: 0,
        results: []
      };
      // JSON化し、スクリプトタグの早期終了を防ぐためエスケープする
      const jsonText = JSON.stringify(savedState, null, 4).replace(/<\/script/gi, '<\\/script');
      const newStateBlock = '  /* SAVED_STATE_START */\n  const state = ' + jsonText + ';\n  /* SAVED_STATE_END */\n';

      const currentHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      const blockPattern = /\/\* SAVED_STATE_START \*\/[\s\S]*?\/\* SAVED_STATE_END \*\/\n?/;
      if (!blockPattern.test(currentHtml)) {
        alert('ほぞんできませんでした。ページを読み込みなおしてからもう一度お試しください。');
        return;
      }
      const newHtml = currentHtml.replace(blockPattern, newStateBlock);

      const blob = new Blob([newHtml], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'jishin-sim.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (err) {
      alert('ほぞんできませんでした。ページを読み込みなおしてからもう一度お試しください。');
    }
  });

  document.querySelectorAll('.stepper button').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.step;
      const delta = parseInt(btn.dataset.delta, 10);
      if (key === 'wait') {
        state.waitSec = Math.min(15, Math.max(0, state.waitSec + delta));
        inputWait.value = state.waitSec;
      } else if (key === 'duration') {
        state.durationSec = Math.min(15, Math.max(3, state.durationSec + delta));
        inputDuration.value = state.durationSec;
      } else if (key === 'intensity') {
        state.intensity = Math.min(5, Math.max(1, state.intensity + delta));
        inputIntensity.value = state.intensity;
      }
    });
  });
  inputWait.addEventListener('change', () => {
    let v = parseInt(inputWait.value, 10);
    if (isNaN(v)) v = 3;
    state.waitSec = Math.min(15, Math.max(0, v));
    inputWait.value = state.waitSec;
  });
  inputDuration.addEventListener('change', () => {
    let v = parseInt(inputDuration.value, 10);
    if (isNaN(v)) v = 6;
    state.durationSec = Math.min(15, Math.max(3, v));
    inputDuration.value = state.durationSec;
  });
  inputIntensity.addEventListener('change', () => {
    let v = parseInt(inputIntensity.value, 10);
    if (isNaN(v)) v = 3;
    state.intensity = Math.min(5, Math.max(1, v));
    inputIntensity.value = state.intensity;
  });

  switchSound.addEventListener('click', () => {
    state.soundOn = !state.soundOn;
    switchSound.classList.toggle('on', state.soundOn);
  });

  function renderQuestionEditors(){
    qEditList.innerHTML = '';
    state.questions.forEach((q, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'q-edit';

      const row1 = document.createElement('div');
      row1.className = 'q-edit-row';
      const label1 = document.createElement('label');
      label1.textContent = (i+1) + 'もんめ';
      const input1 = document.createElement('input');
      input1.type = 'text';
      input1.value = q.text;
      input1.addEventListener('input', () => { state.questions[i].text = input1.value; });
      row1.appendChild(label1);
      row1.appendChild(input1);

      const row2 = document.createElement('div');
      row2.className = 'q-edit-row';
      const label2 = document.createElement('label');
      label2.textContent = '正解';
      const select2 = document.createElement('select');
      const optMaru = document.createElement('option');
      optMaru.value = 'true'; optMaru.textContent = '○';
      const optBatsu = document.createElement('option');
      optBatsu.value = 'false'; optBatsu.textContent = '×';
      select2.appendChild(optMaru);
      select2.appendChild(optBatsu);
      select2.value = q.answer ? 'true' : 'false';
      select2.addEventListener('change', () => { state.questions[i].answer = (select2.value === 'true'); });
      row2.appendChild(label2);
      row2.appendChild(select2);

      const row3 = document.createElement('div');
      row3.className = 'q-edit-img-row';
      const preview = document.createElement('img');
      preview.className = 'q-edit-img-preview';
      const imgBtn = document.createElement('button');
      imgBtn.type = 'button';
      imgBtn.className = 'q-edit-img-btn';
      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'q-edit-img-remove';
      removeBtn.textContent = '画像をけす';
      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = 'image/*';
      fileInput.style.display = 'none';

      const row4 = document.createElement('div');
      row4.className = 'q-edit-img-url';
      const label4 = document.createElement('label');
      label4.textContent = 'URL';
      const urlInput = document.createElement('input');
      urlInput.type = 'text';
      urlInput.placeholder = '画像のURLをはりつけ';
      urlInput.value = (state.questions[i].image && !state.questions[i].image.startsWith('data:')) ? state.questions[i].image : '';
      const urlSetBtn = document.createElement('button');
      urlSetBtn.type = 'button';
      urlSetBtn.textContent = 'ここに入れる';

      function refreshImgUI(){
        if (state.questions[i].image) {
          preview.src = state.questions[i].image;
          preview.classList.add('show');
          removeBtn.classList.add('show');
          imgBtn.textContent = '画像をかえる';
        } else {
          preview.classList.remove('show');
          removeBtn.classList.remove('show');
          imgBtn.textContent = '画像をつける';
        }
      }
      refreshImgUI();

      imgBtn.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          state.questions[i].image = reader.result;
          urlInput.value = '';
          refreshImgUI();
        };
        reader.readAsDataURL(file);
      });
      removeBtn.addEventListener('click', () => {
        state.questions[i].image = null;
        fileInput.value = '';
        urlInput.value = '';
        refreshImgUI();
      });
      urlSetBtn.addEventListener('click', () => {
        const v = urlInput.value.trim();
        if (!v) return;
        state.questions[i].image = v;
        refreshImgUI();
      });

      row3.appendChild(preview);
      row3.appendChild(imgBtn);
      row3.appendChild(removeBtn);
      row3.appendChild(fileInput);

      row4.appendChild(label4);
      row4.appendChild(urlInput);
      row4.appendChild(urlSetBtn);

      const row5 = document.createElement('div');
      row5.className = 'q-edit-delete-row';
      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.className = 'q-edit-delete-btn';
      deleteBtn.textContent = 'このもんだいをけす';
      deleteBtn.addEventListener('click', () => {
        if (state.questions.length <= 1) return;
        state.questions.splice(i, 1);
        renderQuestionEditors();
      });
      if (state.questions.length <= 1) {
        deleteBtn.disabled = true;
        deleteBtn.style.opacity = '.4';
      }
      row5.appendChild(deleteBtn);

      wrap.appendChild(row1);
      wrap.appendChild(row2);
      wrap.appendChild(row3);
      wrap.appendChild(row4);
      wrap.appendChild(row5);
      qEditList.appendChild(wrap);
    });
  }

  btnAddQuestion.addEventListener('click', () => {
    state.questions.push({ text: "あたらしいもんだい", answer: true, image: null });
    renderQuestionEditors();
  });

})();
</script>

<script type="module">
/* =========================================================================
   Quake3D - 3D教室（一人称視点・地震ゆれ・棚アイテム落下）
   参考: いただいたThree.js教室ステージファイルのマテリアル/黒板テクスチャ手法を踏襲
   単一HTML完結 / iPad(Safari)対応 / 廊下・階段・移動操作なし（据え置き視点）
   ========================================================================= */
import * as THREE from 'three';

(function(){
  "use strict";

  const F = '"BIZ UDPGothic", sans-serif';
  function cvs(w, h){ const c = document.createElement('canvas'); c.width=w; c.height=h; return c; }
  function tex(canvas){
    const t = new THREE.CanvasTexture(canvas);
    t.anisotropy = 8;
    t.colorSpace = THREE.SRGBColorSpace;
    t.minFilter = THREE.LinearMipmapLinearFilter;
    t.magFilter = THREE.LinearFilter;
    t.generateMipmaps = true;
    return t;
  }
  function prand(seed){ const v = Math.sin(seed*12.9898)*43758.5453; return v - Math.floor(v); }

  /* ---------- 黒板テクスチャ（参考ファイルの手法を簡略化） ---------- */
  function texBlackboard(){
    const W = 1536, H = 300;
    const c = cvs(W, H), x = c.getContext('2d');
    x.fillStyle = '#0e5c37'; x.fillRect(0,0,W,H);
    x.globalAlpha = .07; x.fillStyle = '#fff';
    for(let i=0;i<20;i++){ x.fillRect(prand(i+1)*W, prand(i+50)*H, 50+prand(i+90)*110, 5+prand(i+130)*12); }
    x.globalAlpha = 1;
    x.strokeStyle = 'rgba(240,244,238,.9)'; x.fillStyle = 'rgba(240,244,238,.92)';
    x.font = `700 30px ${F}`; x.fillText('じしんの れんしゅう', 36, 60);
    x.font = `400 22px ${F}`;
    x.fillText('・つくえの下にかくれる', 40, 130);
    x.fillText('・あたまを まもる', 40, 168);
    // 星の落書き
    const cx=W-230, cy=H*0.42, R=60, r=25;
    x.strokeStyle='rgba(250,230,150,.9)'; x.lineWidth=5; x.beginPath();
    for(let i=0;i<10;i++){ const rad=i%2===0?R:r, a=-Math.PI/2+i*Math.PI/5;
      const px=cx+Math.cos(a)*rad, py=cy+Math.sin(a)*rad;
      i===0?x.moveTo(px,py):x.lineTo(px,py); }
    x.closePath(); x.stroke();
    return tex(c);
  }
  function texWindow(){
    const c = cvs(256, 256), x = c.getContext('2d');
    const g = x.createLinearGradient(0,0,0,256);
    g.addColorStop(0,'#bfe4f5'); g.addColorStop(.6,'#dff1f8'); g.addColorStop(1,'#eaf6e6');
    x.fillStyle = g; x.fillRect(0,0,256,256);
    x.fillStyle = 'rgba(255,255,255,.35)';
    x.beginPath(); x.moveTo(30,230); x.lineTo(130,50); x.lineTo(160,50); x.lineTo(60,230); x.closePath(); x.fill();
    return tex(c);
  }
  function texDoor(){
    const c = cvs(256, 384), x = c.getContext('2d');
    x.fillStyle = '#b98a54'; x.fillRect(0,0,256,384);
    x.strokeStyle = '#8a6339'; x.lineWidth = 10; x.strokeRect(6,6,244,372);
    // ガラス窓部分（上半分）
    x.fillStyle = '#dbe9ee'; x.fillRect(40,36,176,150);
    x.strokeStyle = '#8a6339'; x.lineWidth = 6; x.strokeRect(40,36,176,150);
    // 取っ手
    x.fillStyle = '#6b7278'; x.beginPath(); x.arc(216,240,10,0,Math.PI*2); x.fill();
    return tex(c);
  }
  function texClock(){
    const c = cvs(256, 256), x = c.getContext('2d');
    x.clearRect(0,0,256,256);
    x.fillStyle = '#fbfbf7'; x.beginPath(); x.arc(128,128,120,0,Math.PI*2); x.fill();
    x.strokeStyle = '#33404a'; x.lineWidth = 8; x.beginPath(); x.arc(128,128,120,0,Math.PI*2); x.stroke();
    for(let i=0;i<12;i++){
      const a = i/12*Math.PI*2, big = i%3===0;
      x.lineWidth = big?6:3;
      const r1 = big?96:104, r2 = 112;
      x.beginPath();
      x.moveTo(128+Math.sin(a)*r1, 128-Math.cos(a)*r1);
      x.lineTo(128+Math.sin(a)*r2, 128-Math.cos(a)*r2);
      x.stroke();
    }
    const hand = (ang,len,w,col)=>{ x.strokeStyle=col; x.lineWidth=w; x.beginPath(); x.moveTo(128,128);
      x.lineTo(128+Math.sin(ang)*len, 128-Math.cos(ang)*len); x.stroke(); };
    hand((10+10/60)/12*Math.PI*2, 60, 9, '#33404a');
    hand(10/60*Math.PI*2, 92, 6, '#33404a');
    x.fillStyle = '#33404a'; x.beginPath(); x.arc(128,128,8,0,Math.PI*2); x.fill();
    return tex(c);
  }

  /* ---------- マテリアル ---------- */
  let MAT = {};
  function buildMaterials(){
    MAT.wall     = new THREE.MeshStandardMaterial({ color:0xe9e2d2, roughness:.95 });
    MAT.floor    = new THREE.MeshStandardMaterial({ color:0xd6a866, roughness:.85 });
    MAT.ceil     = new THREE.MeshStandardMaterial({ color:0xf2efe8, roughness:1 });
    MAT.deskTop  = new THREE.MeshStandardMaterial({ color:0xd9b483, roughness:.7 });
    MAT.metal    = new THREE.MeshStandardMaterial({ color:0x9aa0a6, roughness:.5, metalness:.3 });
    MAT.chair    = new THREE.MeshStandardMaterial({ color:0xc98f52, roughness:.7 });
    MAT.frame    = new THREE.MeshStandardMaterial({ color:0x8a5a34, roughness:.6 });
    MAT.shelf    = new THREE.MeshStandardMaterial({ color:0xe0d0ac, roughness:.8 });
    MAT.shelfIn  = new THREE.MeshStandardMaterial({ color:0xe6d9bd, roughness:.85 });
    MAT.itemA    = new THREE.MeshStandardMaterial({ color:0xd97757, roughness:.6 });
    MAT.itemB    = new THREE.MeshStandardMaterial({ color:0x5b8fb0, roughness:.6 });
    MAT.itemC    = new THREE.MeshStandardMaterial({ color:0xe0b84a, roughness:.6 });
    MAT.itemD    = new THREE.MeshStandardMaterial({ color:0x7fa876, roughness:.6 });
    MAT.blackboard = new THREE.MeshStandardMaterial({ map:texBlackboard(), roughness:.9 });
    MAT.window   = new THREE.MeshStandardMaterial({ map:texWindow(), roughness:.4, transparent:true, opacity:.92, side:THREE.DoubleSide });
    MAT.door     = new THREE.MeshStandardMaterial({ map:texDoor(), roughness:.7, side:THREE.DoubleSide });
    MAT.clock    = new THREE.MeshStandardMaterial({ map:texClock(), roughness:.6, transparent:true, side:THREE.DoubleSide });
  }

  function addBox(scene, cx, cy, cz, sx, sy, sz, mat){
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat);
    m.position.set(cx, cy, cz);
    scene.add(m);
    return m;
  }
  function addPlane(scene, cx, cy, cz, w, h, mat, rotY=0){
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    m.position.set(cx, cy, cz); m.rotation.y = rotY;
    scene.add(m); return m;
  }

  function makeDesk(scene, x, z){
    const g = new THREE.Group();
    const topY = 0.62;
    const top = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.05, 0.46), MAT.deskTop);
    top.position.set(0, topY, 0); g.add(top);
    const legGeo = new THREE.BoxGeometry(0.04, topY, 0.04);
    for(const sx of [-0.27,0.27]) for(const sz of [-0.19,0.19]){
      const leg = new THREE.Mesh(legGeo, MAT.metal); leg.position.set(sx, topY/2, sz); g.add(leg);
    }
    // 椅子は机より+Z側（黒板と反対＝手前）に置き、生徒が黒板(-Z方向)を向いて座る形にする
    const seatY = 0.4;
    const seat = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.04, 0.4), MAT.chair);
    seat.position.set(0, seatY, 0.5); g.add(seat);
    const back = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.05), MAT.chair);
    back.position.set(0, seatY+0.22, 0.68); g.add(back);
    const clegGeo = new THREE.BoxGeometry(0.035, seatY, 0.035);
    for(const sx of [-0.17,0.17]) for(const sz of [0.33,0.67]){
      const leg = new THREE.Mesh(clegGeo, MAT.metal); leg.position.set(sx, seatY/2, sz); g.add(leg);
    }
    g.position.set(x, 0, z); scene.add(g);
    return g;
  }

  /* ---------- 作り付けの凹み棚（壁に穴が開いていて中に物が入って見える）＋落下する物 ---------- */
  const fallItems = []; // {mesh, home:{x,y,z}, vel:{x,y,z}, falling:bool, angVel}
  function makeNookShelf(scene, wallX, side, z){
    // wallX: 棚がある側の壁のx座標（例: -halfWや+halfW）
    // side: -1(左壁、部屋の内側=+X方向) / +1(右壁、部屋の内側=-X方向)
    const caseW = 1.1, caseH = 1.7, caseDepth = 0.42;
    const innerX0 = wallX - side*caseDepth; // 部屋の内側の奥行き終端
    const midX = (wallX + innerX0)/2;

    // 背板（壁に密着、これが「奥」に見える面）
    addBox(scene, wallX - side*0.01, caseH/2, z, 0.02, caseH, caseW, MAT.shelfIn);
    // 上下の板
    addBox(scene, midX, caseH, z, caseDepth, 0.05, caseW, MAT.shelf);
    addBox(scene, midX, 0.02, z, caseDepth, 0.05, caseW, MAT.shelf);
    // 左右の側板（幅方向の端）
    addBox(scene, midX, caseH/2, z-caseW/2, caseDepth, caseH, 0.04, MAT.shelf);
    addBox(scene, midX, caseH/2, z+caseW/2, caseDepth, caseH, 0.04, MAT.shelf);
    // 中段の棚板（2段）
    const levelYs = [caseH*0.34, caseH*0.67];
    for(const ly of levelYs){
      addBox(scene, midX, ly, z, caseDepth, 0.04, caseW*0.94, MAT.shelf);
    }

    // 段ごとに物（本立て風の箱・小物）を並べる。物理的には別メッシュとしてワールド座標で管理
    const levels = [0.06, levelYs[0]+0.02, levelYs[1]+0.02];
    const itemMats = [MAT.itemA, MAT.itemB, MAT.itemC, MAT.itemD];
    let mi = 0;
    levels.forEach((baseY, li) => {
      const count = 3;
      for(let k=0;k<count;k++){
        const sw = 0.1 + prand(li*10+k)*0.05;
        const sh = 0.16 + prand(li*10+k+3)*0.14;
        const sd = caseDepth*0.72;
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(sd, sh, sw), itemMats[mi % itemMats.length]);
        mi++;
        const homeX = midX - side*0.02;
        const homeY = baseY + sh/2;
        const homeZ = z - caseW*0.36 + k*(caseW*0.32);
        mesh.position.set(homeX, homeY, homeZ);
        mesh.rotation.y = (prand(li*20+k)-0.5)*0.15;
        scene.add(mesh);
        fallItems.push({
          mesh, home:{x:homeX, y:homeY, z:homeZ},
          vel:{x:0, y:0, z:0}, falling:false, angVel:{x:0,y:0,z:0},
          side, floorY: homeY
        });
      }
    });
  }

  /* ---------- 教室構築（黒板が奥、窓が側面、左壁=扉、右壁=凹み棚） ---------- */
  const ROOM_W = 4.6, ROOM_D = 5.2, ROOM_H = 2.9;
  function buildRoom(scene){
    const halfW = ROOM_W/2, halfD = ROOM_D/2;
    // 床・天井
    addBox(scene, 0, -0.05, 0, ROOM_W, 0.1, ROOM_D, MAT.floor);
    addBox(scene, 0, ROOM_H+0.05, 0, ROOM_W, 0.1, ROOM_D, MAT.ceil);
    // 奥の壁＋黒板（時計と重ならないよう黒板を少し下げる。黒板をフレームより手前に出す）
    addBox(scene, 0, ROOM_H/2, -halfD, ROOM_W, ROOM_H, 0.15, MAT.wall);
    addBox(scene, 0, 1.28, -halfD+0.09, 2.75, 1.25, 0.05, MAT.frame);
    addPlane(scene, 0, 1.28, -halfD+0.13, 2.6, 1.05, MAT.blackboard, 0);
    addPlane(scene, 0, 2.35, -halfD+0.1, 0.42, 0.42, MAT.clock, 0);
    // 手前の壁（扉開口のみ。左右に柱状の壁は作らない）
    addBox(scene, 0, ROOM_H-0.4, halfD, ROOM_W, 0.8, 0.15, MAT.wall);
    // 側面の壁
    addBox(scene, -halfW, ROOM_H/2, 0, 0.15, ROOM_H, ROOM_D, MAT.wall);
    addBox(scene,  halfW, ROOM_H/2, 0, 0.15, ROOM_H, ROOM_D, MAT.wall);
    // 左壁：奥にドア（窓はなし）
    const doorZ = -halfD*0.5, doorH = 2.0, doorW2 = 0.95;
    addBox(scene, -halfW+0.05, doorH/2, doorZ, 0.04, doorH+0.08, doorW2+0.1, MAT.frame);
    addPlane(scene, -halfW+0.14, doorH/2, doorZ, doorW2, doorH, MAT.door, Math.PI/2);
    // 右壁：奥行きのある凹み棚（黒板に近い奥寄りに設置、中に物が入って見える。窓はなし）
    makeNookShelf(scene, halfW, 1, -halfD*0.45);
    // 机（2行×3列、黒板を向く。中央1台だけがカメラ正面に迫らないよう奥行きに余裕を持たせる）
    const cols = [-1.1, 0, 1.1];
    const rows = [-0.1, 1.0];
    for(const rz of rows){ for(const cx of cols){ makeDesk(scene, cx, rz); } }
  }

  /* ---------- カメラ・シーン初期化 ---------- */
  let scene, camera, renderer;
  const canvas = document.getElementById('quake3d-canvas');
  const HOME_CAM = { x:0, y:1.62, z: ROOM_D/2 - 0.75, pitch:-0.22, yaw:0 };
  const camState = { x:0, y:1.5, z:0, pitch:0, yaw:0 };

  function resetCamHome(){
    camState.x = HOME_CAM.x; camState.y = HOME_CAM.y; camState.z = HOME_CAM.z;
    camState.pitch = HOME_CAM.pitch; camState.yaw = HOME_CAM.yaw;
  }

  function initScene(){
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf3f6f8);
    scene.fog = new THREE.Fog(0xf3f6f8, 9, 16);

    camera = new THREE.PerspectiveCamera(62, 1, 0.05, 60);
    camera.rotation.order = 'YXZ';
    resetCamHome();

    renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    scene.add(new THREE.HemisphereLight(0xffffff, 0xb8bcae, 1.6));
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const dir = new THREE.DirectionalLight(0xfff6e0, 1.5);
    dir.position.set(-3, 6, 2); scene.add(dir);
    const dir2 = new THREE.DirectionalLight(0xf0f6ff, 0.7);
    dir2.position.set(3, 5, -2); scene.add(dir2);

    buildMaterials();
    buildRoom(scene);

    resizeRenderer();
  }

  function resizeRenderer(){
    const el = document.getElementById('shake-root');
    if (!el) return;
    const w = el.clientWidth || 1, h = el.clientHeight || 1;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  }
  addEventListener('resize', resizeRenderer);

  /* ---------- 地震ゆれ制御 ---------- */
  const quake = {
    running: false,
    elapsedMs: 0,
    durationMs: 6000,
    intensity: 3,
    onDone: null,
    fallStartSec: 0.9 // 揺れ開始からこの秒数後に物が落ち始める
  };

  function intensityToAmp(level){ return 0.02 + level*0.012; }

  function startShake(durationSec, intensityLevel, onDone){
    quake.running = true;
    quake.elapsedMs = 0;
    quake.durationMs = durationSec * 1000;
    quake.intensity = intensityLevel;
    quake.onDone = onDone;
    fallItems.forEach(it => { it.falling = false; it.vel.x=0; it.vel.y=0; it.vel.z=0; it.angVel.x=0; it.angVel.y=0; it.angVel.z=0; });
  }

  function resetQuake(){
    quake.running = false;
    quake.elapsedMs = 0;
    camState.x = HOME_CAM.x; camState.y = HOME_CAM.y; camState.z = HOME_CAM.z;
    camState.pitch = HOME_CAM.pitch; camState.yaw = HOME_CAM.yaw;
    crouchState.active = false; crouchState.amount = 0;
    fallItems.forEach(it => {
      it.mesh.position.set(it.home.x, it.home.y, it.home.z);
      it.mesh.rotation.set(0,0,0);
      it.falling = false;
    });
  }

  const crouchState = { active:false, amount:0 };
  function setCrouch(on){ /* 視点変化は行わない仕様のため何もしない */ }

  function updateQuake(dtSec){
    if (!quake.running) return;
    quake.elapsedMs += dtSec*1000;
    const progress = Math.min(quake.elapsedMs / quake.durationMs, 1);
    let envelope;
    if (progress < 0.15) envelope = progress/0.15;
    else if (progress < 0.7) envelope = 1;
    else envelope = Math.max(0, 1-(progress-0.7)/0.3);

    const amp = intensityToAmp(quake.intensity) * envelope;
    const t = quake.elapsedMs / 1000;
    const dx = Math.sin(t*18)*amp + Math.sin(t*7.3)*amp*0.3;
    const dy = Math.cos(t*21)*amp*0.4;
    const dz = Math.sin(t*15.5)*amp*0.25;
    const rotZ = Math.sin(t*13)*envelope*0.045;
    const rotX = Math.cos(t*11)*envelope*0.02;

    camState.shakeX = dx; camState.shakeY = dy; camState.shakeZ = dz;
    camState.shakeRotZ = rotZ; camState.shakeRotX = rotX;

    // 棚の物：一定時間後、envelopeが十分なら落下開始
    const elapsedSec = quake.elapsedMs/1000;
    if (elapsedSec > quake.fallStartSec && envelope > 0.5){
      fallItems.forEach((it, i) => {
        if (!it.falling && prand(i*7 + Math.floor(elapsedSec*3)) > 0.7){
          it.falling = true;
          const outward = it.side ? -it.side : (prand(i+2)>0.5?1:-1); // 棚の前方＝部屋の内側へ
          it.vel.x = outward * (0.55 + prand(i+1)*0.35);
          it.vel.y = 0;
          it.vel.z = (prand(i+9)-0.5)*0.08;
          it.angVel.x = (prand(i+3)-0.5)*2.2;
          it.angVel.y = (prand(i+5)-0.5)*2.2;
          it.angVel.z = (prand(i+7)-0.5)*2.2;
          it.onFloor = false; // まだ床に落ちきっていない（棚板の上を滑っている段階）
        }
      });
    }
    // 落下シミュレーション（簡易重力）。棚の前方へ十分出たら部屋の床まで落ち、それ以外は棚板の上に留まる
    fallItems.forEach(it => {
      if (!it.falling) return;
      const outward = it.side ? -it.side : 1;
      const traveled = (it.mesh.position.x - it.home.x) * outward; // 前方への移動距離
      const clearedShelf = traveled > 0.32; // 棚板の縁（奥行き分）を越えたら棚から落ちる

      it.vel.y -= (clearedShelf ? 9.8 : 0) * dtSec; // 棚板の上にいる間は重力を効かせない（滑るだけ）。落下は実際の重力加速度に近づける
      it.mesh.position.x += it.vel.x * dtSec;
      it.mesh.position.y += it.vel.y * dtSec;
      it.mesh.position.z += it.vel.z * dtSec;
      it.mesh.rotation.x += it.angVel.x * dtSec;
      it.mesh.rotation.y += it.angVel.y * dtSec;
      it.mesh.rotation.z += it.angVel.z * dtSec;

      const floorY = clearedShelf ? 0.05 : it.floorY;
      if (it.mesh.position.y < floorY){
        it.mesh.position.y = floorY;
        it.vel.x *= 0.4; it.vel.y = 0; it.vel.z *= 0.4;
        it.angVel.x *= 0.3; it.angVel.y *= 0.3; it.angVel.z *= 0.3;
      }
      // 手前方向のみ許容し、奥（背板側）へは戻さない。左右のはみ出しも抑える
      if (it.home){
        const maxDx = 1.1, maxDz = 0.35;
        const dx = it.mesh.position.x - it.home.x, dz = it.mesh.position.z - it.home.z;
        if (Math.abs(dx) > maxDx) it.mesh.position.x = it.home.x + Math.sign(dx)*maxDx;
        if ((dx*outward) < 0) it.mesh.position.x = it.home.x; // 奥へ戻ろうとしたら元の奥行き位置に留める
        if (Math.abs(dz) > maxDz) it.mesh.position.z = it.home.z + Math.sign(dz)*maxDz;
      }
    });

    if (progress >= 1){
      quake.running = false;
      camState.shakeX = 0; camState.shakeY = 0; camState.shakeZ = 0;
      camState.shakeRotZ = 0; camState.shakeRotX = 0;
      const cb = quake.onDone; quake.onDone = null;
      if (cb) cb();
    }
  }

  /* ---------- ループ ---------- */
  let lastT = 0;
  function animate(t){
    requestAnimationFrame(animate);
    let dt = (t - lastT)/1000; lastT = t;
    if (!isFinite(dt) || dt <= 0) dt = 1/60;
    dt = Math.min(dt, 1/30); // dtクランプ（120Hz対策）

    const screenQuake = document.getElementById('screen-quake');
    if (!screenQuake || !screenQuake.classList.contains('active')) return;

    updateQuake(dt);

    // しゃがみ量をなめらかに補間
    const targetCrouch = crouchState.active ? 0.55 : 0;
    crouchState.amount += (targetCrouch - crouchState.amount) * Math.min(1, dt*6);

    const sx = camState.shakeX||0, sy = camState.shakeY||0, sz = camState.shakeZ||0;
    const srz = camState.shakeRotZ||0, srx = camState.shakeRotX||0;

    camera.position.set(camState.x + sx, camState.y - crouchState.amount + sy, camState.z + sz);
    camera.rotation.set(camState.pitch + srx, camState.yaw, srz, 'YXZ');

    resizeRenderer();
    renderer.render(scene, camera);
  }

  function init(){
    initScene();
    requestAnimationFrame(t => { lastT = t; animate(t); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  window.Quake3D = {
    reset: resetQuake,
    startShake,
    crouch: setCrouch
  };
})();
</script>
</body>
</html>
